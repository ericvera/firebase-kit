# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, so a major bump
      # breaks `yarn lint` outright. Stay on 6.x until it does.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # Track the Node LTS the packages declare (`engines.node >= 24`) rather
      # than the newest types release.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      dev-non-major:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
      prod-non-major:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-non-major:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
