name: 'Setup Firebase Tools Cache'
description: 'Gets Firebase tools version and sets up cache for Firebase emulators'

runs:
  using: 'composite'
  steps:
    - name: Setup Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Get firebase-tools version
      shell: bash
      run: |
        pkg_info=$(yarn info firebase-tools --name-only --json)
        echo "FIREBASE_TOOLS_VERSION=$pkg_info" >> $GITHUB_OUTPUT
      id: package_version

    - name: Cache Firebase Tools
      uses: actions/cache@v5
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-${{ steps.package_version.outputs.FIREBASE_TOOLS_VERSION }}
